<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor HDR inmobiliario</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f6f4;
    --panel: #ffffff;
    --ink: #17171a;
    --muted: #6b6b74;
    --line: #e2e2dd;
    --accent: #2f6d4f;
    --accent-ink: #ffffff;
    --warn: #9a6410;
    --error: #a33232;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16171a; --panel: #1e1f23; --ink: #ececef; --muted: #9a9aa4;
      --line: #303138; --accent: #4d9a74; --accent-ink: #0d0d0f;
      --warn: #d19a4a; --error: #e07a7a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 2rem 1.25rem 4rem;
    background: var(--bg); color: var(--ink);
    font: 15px/1.55 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
  }
  main { max-width: 780px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: 0 0 .25rem; letter-spacing: -.01em; }
  .sub { color: var(--muted); margin: 0 0 2rem; font-size: .92rem; }
  h2 { font-size: .82rem; text-transform: uppercase; letter-spacing: .07em;
       color: var(--muted); margin: 2rem 0 .75rem; font-weight: 600; }
  .card { background: var(--panel); border: 1px solid var(--line);
          border-radius: var(--radius); padding: 1.1rem 1.2rem; margin-bottom: .75rem; }
  label { display: block; font-size: .85rem; color: var(--muted); margin-bottom: .35rem; }
  input[type=text] {
    width: 100%; padding: .6rem .7rem; font: inherit; font-size: .92rem;
    border: 1px solid var(--line); border-radius: 7px;
    background: var(--bg); color: var(--ink);
  }
  input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button {
    font: inherit; font-size: .9rem; font-weight: 550; cursor: pointer;
    padding: .55rem 1.1rem; border-radius: 7px;
    border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink);
  }
  button.ghost { background: transparent; color: var(--muted); border-color: var(--line); }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: .6rem; align-items: flex-end; flex-wrap: wrap; }
  .row > div { flex: 1 1 260px; }
  .drop {
    border: 1.5px dashed var(--line); border-radius: var(--radius);
    padding: 1.6rem 1rem; text-align: center; color: var(--muted);
    font-size: .9rem; transition: border-color .15s, background .15s;
  }
  .drop.over { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .job { background: var(--panel); border: 1px solid var(--line);
         border-radius: var(--radius); padding: .9rem 1.1rem; margin-bottom: .6rem; }
  .job header { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; }
  .job h3 { margin: 0; font-size: .98rem; font-weight: 600; }
  .state { font-size: .78rem; color: var(--muted); white-space: nowrap; }
  .bar { height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; margin: .65rem 0 .5rem; }
  .bar > span { display: block; height: 100%; background: var(--accent);
                transition: width .35s ease; border-radius: 3px; }
  .meta { font-size: .84rem; color: var(--muted); }
  .actions { display: flex; gap: .5rem; margin-top: .8rem; }
  details { margin-top: .7rem; font-size: .85rem; }
  summary { cursor: pointer; color: var(--muted); }
  ul.scenes { list-style: none; padding: .6rem 0 0; margin: 0; }
  ul.scenes li { padding: .3rem 0; border-top: 1px solid var(--line); }
  .tag { font-size: .74rem; padding: .08rem .42rem; border-radius: 4px;
         border: 1px solid currentColor; margin-right: .45rem; }
  .ok { color: var(--accent); }
  .review { color: var(--warn); }
  .err { color: var(--error); }
  .empty { color: var(--muted); font-size: .9rem; padding: 1.5rem 0; }
  .hint { font-size: .8rem; color: var(--muted); margin-top: .5rem; }
</style>
</head>
<body>
<main>
  <h1>Editor HDR inmobiliario</h1>
  <p class="sub">Suelta los brackets, recoge los JPEG. Todo se procesa en este ordenador.</p>

  <h2>Nuevo lote</h2>

  <div class="card">
    <div class="row">
      <div>
        <label for="path">Carpeta local con los RAW</label>
        <input type="text" id="path" placeholder="/Users/tu/Fotos/CalleMayor12" spellcheck="false">
      </div>
      <button id="go">Procesar</button>
    </div>
    <p class="hint">Recomendado para lotes grandes: lee la carpeta directamente, sin copiar gigas de RAW.</p>
  </div>

  <div class="card">
    <div class="drop" id="drop">
      Arrastra aqui los archivos, o <label for="picker" style="display:inline; color:var(--accent); cursor:pointer; text-decoration:underline">elige una carpeta</label>
      <input type="file" id="picker" webkitdirectory multiple hidden>
    </div>
  </div>

  <h2>Lotes</h2>
  <div id="jobs"><p class="empty">Todavia no has procesado nada.</p></div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const jobsEl = $("jobs");

async function api(url, options) {
  const response = await fetch(url, options);
  if (!response.ok) {
    const body = await response.json().catch(() => ({}));
    throw new Error(body.detail || `error ${response.status}`);
  }
  return response.json();
}

// --- crear lotes ---------------------------------------------------------

async function submitFolder() {
  const path = $("path").value.trim();
  if (!path) return;
  const body = new FormData();
  body.append("path", path);
  $("go").disabled = true;
  try {
    await api("/api/jobs/folder", { method: "POST", body });
    $("path").value = "";
    refresh();
  } catch (error) {
    alert(error.message);
  } finally {
    $("go").disabled = false;
  }
}

async function submitFiles(fileList) {
  const files = [...fileList];
  if (!files.length) return;
  const body = new FormData();
  // Si viene de "elegir carpeta", el nombre de la carpeta esta en la ruta relativa.
  const first = files[0].webkitRelativePath || "";
  body.append("name", first.includes("/") ? first.split("/")[0] : "lote");
  files.forEach((file) => body.append("files", file));

  const drop = $("drop");
  const original = drop.textContent;
  drop.textContent = `Subiendo ${files.length} archivos...`;
  try {
    await api("/api/jobs/upload", { method: "POST", body });
    refresh();
  } catch (error) {
    alert(error.message);
  } finally {
    drop.textContent = original;
  }
}

$("go").addEventListener("click", submitFolder);
$("path").addEventListener("keydown", (event) => { if (event.key === "Enter") submitFolder(); });
$("picker").addEventListener("change", (event) => submitFiles(event.target.files));

const drop = $("drop");
["dragenter", "dragover"].forEach((type) =>
  drop.addEventListener(type, (event) => { event.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach((type) =>
  drop.addEventListener(type, () => drop.classList.remove("over")));
drop.addEventListener("drop", (event) => {
  event.preventDefault();
  submitFiles(event.dataTransfer.files);
});

// --- listado -------------------------------------------------------------

function escapeHtml(text) {
  return String(text).replace(/[&<>"]/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function sceneRow(scene) {
  const cls = scene.error ? "err" : scene.entregada ? "ok" : "review";
  const label = scene.error ? "error" : scene.entregada ? "ok" : "revisar";
  const reasons = [...(scene.motivos || []), scene.error].filter(Boolean).join("; ");
  return `<li><span class="tag ${cls}">${label}</span>${escapeHtml(scene.nombre)}
    ${reasons ? `<div class="meta">${escapeHtml(reasons)}</div>` : ""}</li>`;
}

function jobCard(job) {
  const running = job.state === "procesando" || job.state === "en cola";
  const summary = job.state === "terminado"
    ? `${job.delivered} entregadas · ${job.review} a revisar · ${job.errors} con error · ${job.elapsed}s`
    : escapeHtml(job.message);

  return `<div class="job">
    <header>
      <h3>${escapeHtml(job.name)}</h3>
      <span class="state">${escapeHtml(job.state)}${running && job.total ? ` ${job.done}/${job.total}` : ""}</span>
    </header>
    ${running ? `<div class="bar"><span style="width:${job.progress}%"></span></div>` : ""}
    <div class="meta">${summary}</div>
    <div class="actions">
      ${job.zip_ready ? `<button onclick="location.href='/api/jobs/${job.id}/zip'">Descargar ZIP</button>` : ""}
      <button class="ghost" onclick="removeJob('${job.id}')">Eliminar</button>
    </div>
    ${job.detail && job.detail.length
      ? `<details><summary>Ver las ${job.detail.length} escenas</summary>
         <ul class="scenes">${job.detail.map(sceneRow).join("")}</ul></details>`
      : ""}
  </div>`;
}

async function removeJob(id) {
  if (!confirm("Eliminar este lote y sus archivos?")) return;
  await fetch(`/api/jobs/${id}`, { method: "DELETE" });
  refresh();
}

async function refresh() {
  try {
    const jobs = await api("/api/jobs");
    jobsEl.innerHTML = jobs.length
      ? jobs.map(jobCard).join("")
      : '<p class="empty">Todavia no has procesado nada.</p>';
    // Solo se sondea rapido mientras hay algo en marcha.
    const active = jobs.some((job) => job.state === "procesando" || job.state === "en cola");
    clearTimeout(refresh.timer);
    refresh.timer = setTimeout(refresh, active ? 1500 : 15000);
  } catch (error) {
    clearTimeout(refresh.timer);
    refresh.timer = setTimeout(refresh, 5000);
  }
}

refresh();
</script>
</body>
</html>
